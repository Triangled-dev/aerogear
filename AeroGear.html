/* ---------- Scratch-compatible casting & maths ---------- */
const N=x=>{if(typeof x==='number')return x!==x?0:x;if(typeof x==='boolean')return x?1:0;const n=Number(x);return n!==n?0:n;};
const BO=x=>{if(typeof x==='boolean')return x;if(typeof x==='string')return !(x===''||x==='0'||x.toLowerCase()==='false');return Boolean(x);};
const STR=x=>String(x);
const isWS=s=>typeof s==='string'&&/^\s*$/.test(s);
function CMP(a,b){let n1=Number(a),n2=Number(b);if(n1===0&&isWS(a))n1=NaN;if(n2===0&&isWS(b))n2=NaN;
 if(n1!==n1||n2!==n2){const s1=String(a).toLowerCase(),s2=String(b).toLowerCase();return s1<s2?-1:s1>s2?1:0;}
 if((n1===Infinity&&n2===Infinity)||(n1===-Infinity&&n2===-Infinity))return 0;return n1-n2;}
function MOD(a,b){const n=N(a),m=N(b);let r=n%m;if(r/m<0)r+=m;return r;}
function MOP(op,n){n=N(n);switch(op){
 case 'abs':return Math.abs(n);case 'floor':return Math.floor(n);case 'sqrt':return Math.sqrt(n);
 case 'sin':return Math.round(Math.sin(Math.PI*n/180)*1e10)/1e10;
 case 'cos':return Math.round(Math.cos(Math.PI*n/180)*1e10)/1e10;
 case 'tan':{const m=n%360;if(m===-270||m===90)return Infinity;if(m===-90||m===270)return -Infinity;return parseFloat(Math.tan(Math.PI*m/180).toFixed(10));}
 case 'atan':return Math.atan(n)*180/Math.PI;
 case '10 ^':return Math.pow(10,n);}
 return 0;}
function LETTER(i,s){return String(s).charAt(Math.floor(N(i))-1);}
function ITEM(l,i){const k=Math.floor(N(i));return(k<1||k>l.length)?'':l[k-1];}

const cl=(v,a,b)=>v<a?a:v>b?b:v;
function hsv2rgb(h,s,v){h=h%360;if(h<0)h+=360;s=cl(s,0,1);v=cl(v,0,1);const i=Math.floor(h/60),f=h/60-i,p=v*(1-s),q=v*(1-s*f),t=v*(1-s*(1-f));
 let r,g,b;switch(i){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;default:r=v;g=p;b=q;}
 return[Math.round(r*255),Math.round(g*255),Math.round(b*255)];}
function css(p){if(p.css)return p.css;const[r,g,b]=hsv2rgb(p.h*3.6,p.s/100,p.b/100);return p.css='rgba('+r+','+g+','+b+','+(1-p.t/100)+')';}
function dot(sp){const p=sp.pen;ctx.fillStyle=css(p);ctx.beginPath();ctx.arc(240+sp.x,180-sp.y,p.size/2,0,6.283185307);ctx.fill();}
function line(sp,x0,y0,x1,y1){const p=sp.pen;if(x0===x1&&y0===y1){dot(sp);return;}
 ctx.strokeStyle=css(p);ctx.lineWidth=p.size;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(240+x0,180-y0);ctx.lineTo(240+x1,180-y1);ctx.stroke();}
function GOTO(sp,x,y){x=cl(N(x),-240,240);y=cl(N(y),-180,180);if(sp.pen.down)line(sp,sp.x,sp.y,x,y);sp.x=x;sp.y=y;}

function PEN_COLOR(sp,c){const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(String(c));const p=sp.pen;if(!m)return;
 const r=parseInt(m[1],16)/255,g=parseInt(m[2],16)/255,b=parseInt(m[3],16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
 let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
